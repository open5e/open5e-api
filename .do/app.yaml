name: open5e-api
services:
  - name: elasticsearch
    image:
      registry_type: DOCKER_HUB
      repository: docker.elastic.co/elasticsearch/elasticsearch
      tag: "8.11.0"
    http_port: 9200
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: discovery.type
        value: single-node
      - key: xpack.security.enabled
        value: "false"
      - key: ES_JAVA_OPTS
        value: "-Xms512m -Xmx512m -Des.entitlements.enabled=false"
      - key: network.host
        value: "0.0.0.0"
    health_check:
      http_path: "/_cluster/health"
      initial_delay_seconds: 60
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3

  - name: api
    github:
      repo: open5e/open5e-api
      branch: main
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: ELASTICSEARCH_URL
        value: "http://elasticsearch:9200/"
    health_check:
      http_path: "/"
      initial_delay_seconds: 60
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
